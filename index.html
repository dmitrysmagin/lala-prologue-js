<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaLa - TypeScript Port</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: monospace;
      }
      #gameCanvas {
        background: #000;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="320" height="200"></canvas>
    <div id="startBanner" style="
      position:fixed;inset:0;z-index:100;
      display:flex;justify-content:center;align-items:center;
      background:#000;cursor:pointer;
      font-family:monospace;text-align:center;
    ">
      <div>
        <div style="color:#0f0;font-size:24px;letter-spacing:4px;margin-bottom:12px">LALA</div>
        <div style="color:#fff;font-size:13px;letter-spacing:2px;opacity:0.8">CLICK TO START</div>
        <div style="color:#888;font-size:10px;margin-top:8px;opacity:0.5">enables sound</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
